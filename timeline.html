<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>共同时间轴 · Keeppush</title><link rel="stylesheet" href="assets/css/theme.css"></head><body><div class="stars"></div><header class="topbar"><div class="shell nav"><a class="brand" href="index.html"><span class="brand-mark">♥</span>Keeppush</a><nav class="navlinks" data-nav></nav></div></header><main class="shell"><section class="page-title"><div class="eyebrow">Shared timeline</div><h1>把时间留下来。</h1><p class="lede">重要的，平凡的，只有你们知道为什么值得记住的。</p></section><div class="filters" id="timeline-filters"><button class="active" data-filter="all">全部</button><button data-filter="故事">故事</button><button data-filter="旅行">旅行</button><button data-filter="节日">节日</button></div><div class="timeline" id="timeline-list"></div><section class="card"><h3>写下一段新的回忆</h3><form id="timeline-form"><div class="form-row"><div class="field"><label for="memory-date">日期</label><input id="memory-date" type="date"></div><div class="field"><label for="memory-tag">标签</label><input id="memory-tag" placeholder="例如：旅行"></div></div><div class="field"><label for="memory-title">标题</label><input id="memory-title" required placeholder="这一天发生了什么"></div><div class="field"><label for="memory-text">文字</label><textarea id="memory-text" placeholder="写给未来的你们"></textarea></div><button class="button primary">保存到本浏览器</button></form></section></main><script src="assets/js/data.js"></script><script src="assets/js/site.js"></script><script src="assets/js/page-timeline.js"></script></body></html>
